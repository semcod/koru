[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koru"
version = "0.1.377"
description = "Closed-loop automation across semcod/* repositories."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Semcod" }, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
keywords = ["automation", "refactor", "semcod", "koru", "closed-loop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "gillm>=0.1.9",
    "pyyaml>=6.0,<7.0",
    "rich>=14.3.4",
    # Zero-dep shell-client registry/driver; core so `--ide claude` can never
    # silently fall through to an editor lane (see docs/boundary-refactoring-proposal.md).
    "tillm>=0.1.35",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/semcod/koru"
Issues = "https://github.com/semcod/koru/issues"
Repository = "https://github.com/semcod/koru"

[project.optional-dependencies]
watch = [
    "websockets>=12.0,<17.0",
]
vision = [
    "mss>=9.0,<11.0",
]
mesh = [
    "websockets>=12.0,<17.0",
]
observe = [
    "mss>=9.0,<11.0",
    "websockets>=12.0,<17.0",
]
desktop = [
    "nlp2uri[envmap]>=0.4.7",
    "env2llm[mqtt]>=0.1.10",
    "planfile>=0.1.100",
    "testql>=1.2.55",
]
imgl = [
    "httpx>=0.27,<1.0",
]
envmap = [
    "nlp2uri[envmap]>=0.4.7",
    "env2llm[mqtt]>=0.1.10",
]
testql = [
    "testql>=1.2.55",
]
# The queue loop shells out to `planfile`; without this extra the resolver
# can end up with no usable planfile anywhere and every cycle dies with
# planfile_error (2026-07-03 incident: 17 stagnant cycles on c2004).
planfile = [
    "planfile>=0.1.100",
]
curllm = [
    "curllm[mcp]>=1.0.0",
]
browser = [
    "nlp2uri[envmap]>=0.4.7",
    "env2llm[mqtt]>=0.1.10",
    "testql>=1.2.55",
    "curllm[mcp]>=1.0.0",
    "playwright>=1.40,<2.0",
]
vdisplay = [
    "vdisplay>=0.1.35",
]
dev = [
    "gillm>=0.1.9",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-rerunfailures>=14.0,<17.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-xdist>=3.0,<4.0",
    "ruff>=0.11,<0.16",
    "mypy>=1.11,<3.0",
    "pyright>=1.1.390,<2.0",
    "hypothesis>=6.112,<7.0",
    "pre-commit>=3.8,<5.0",
    "types-PyYAML>=6.0,<7.0",
    "goal>=2.1.264",
    "costs>=0.1.53",
    "pfix>=0.1.60",
    "tagi>=0.49.0",
]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "prometheus-client>=0.21,<1.0",
]
agent = [
    "instructor>=1.6,<2.0",
    "litellm>=1.51,<2.0",
    "openai>=1.54,<3.0",
    "tiktoken>=0.8,<1.0",
]
fullm = [
    "fullm>=0.1.22",
]
tillm = [
    # kept for backwards-compatible `koru[tillm]` installs; tillm is already a
    # core dependency — keep this floor in sync with [project.dependencies]
    "tillm>=0.1.35",
]
obs = [
    "nfo>=0.2.22,<1.0",
    "opentelemetry-exporter-otlp>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.49b0,<1.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "sentry-sdk>=2.18,<3.0",
    "structlog>=24.4,<26.0",
]
queue = [
    "apscheduler>=3.10,<4.0",
    "arq>=0.26,<1.0",
    "redis>=5.1,<8.0",
]
quality = [
    "import-linter>=2.0,<3.0",
    "mutmut>=3.2,<4.0",
    "pyupgrade>=3.17,<4.0",
    "refurb>=2.0,<3.0",
]
all = [
    "apscheduler>=3.10,<4.0",
    "arq>=0.26,<1.0",
    "fastapi>=0.115,<1.0",
    "gillm>=0.1.9",
    "hypothesis>=6.112,<7.0",
    "httpx>=0.27,<1.0",
    "import-linter>=2.0,<3.0",
    "instructor>=1.6,<2.0",
    "litellm>=1.51,<2.0",
    "mutmut>=3.2,<4.0",
    "mypy>=1.11,<3.0",
    "mss>=9.0,<11.0",
    "nfo>=0.2.22,<1.0",
    "openai>=1.54,<3.0",
    "opentelemetry-exporter-otlp>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.49b0,<1.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "pre-commit>=3.8,<5.0",
    "prometheus-client>=0.21,<1.0",
    "pyright>=1.1.390,<2.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-rerunfailures>=14.0,<17.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-xdist>=3.0,<4.0",
    "pyupgrade>=3.17,<4.0",
    "redis>=5.1,<8.0",
    "refurb>=2.0,<3.0",
    "ruff>=0.11,<0.16",
    "tillm>=0.1.35",
    "sentry-sdk>=2.18,<3.0",
    "structlog>=24.4,<26.0",
    "tiktoken>=0.8,<1.0",
    "types-PyYAML>=6.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
    "websockets>=12.0,<17.0",
    "goal>=2.1.264",
    "costs>=0.1.53",
    "pfix>=0.1.60",
    "tagi>=0.49.0",
    "curllm[mcp]>=1.0.0",
    "env2llm[mqtt]>=0.1.10",
    "fullm>=0.1.22",
    "nlp2uri[envmap]>=0.4.7",
    "planfile>=0.1.100",
    "playwright>=1.40,<2.0",
    "testql>=1.2.55",
    "vdisplay>=0.1.35",
]

[project.scripts]
coru = "coru.cli:main"
koru = "koru.cli:main"
koru-wup-testql = "koru.wup_testql_compat:main"
koru-dsl = "korudsl.cli:main"
koru-api = "koruapi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-rerunfailures>=14.0,<17.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-xdist>=3.0,<4.0",
    "ruff>=0.11,<0.16",
    "mypy>=1.11,<3.0",
    "pyright>=1.1.390,<2.0",
    "hypothesis>=6.112,<7.0",
    "pre-commit>=3.8,<5.0",
    "types-PyYAML>=6.0,<7.0",
    "goal>=2.1.264",
    "costs>=0.1.53",
    "pfix>=0.1.60",
    "tagi>=0.49.0",
    "jsonschema>=4.0",
    "protobuf>=5.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.0",
    # uv sync prunes ad-hoc pip installs; the queue needs planfile in the
    # default-synced group or every sync reintroduces planfile_error.
    "planfile>=0.1.100",
    # photo-VQL / vision chat drive imports vdisplay; without it in the
    # default-synced group every `uv sync` (i.e. every goal release) drops it
    # and the daemon's vision path silently disables.
    "vdisplay>=0.1.44",
]
control = [
    "jsonschema>=4.0",
    "protobuf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
tillm = { path = "../tillm", editable = true }
# keep the sibling checkout editable through uv/goal syncs — a registry
# install kept resurfacing in .venv and shadowing local gillm changes
gillm = { path = "../gillm", editable = true }
vdisplay = { path = "../../wronai/vdisplay", editable = true }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src", "packages/coru/src"]
# src/ also holds test-only stubs (imgl, env2llm, nlp2imgl) that shadow real
# PyPI packages of the same name — they must never ship in the wheel.
include = ["koru*", "coru*"]

[tool.setuptools.package-data]
koru = [
    "scripts/*.sh",
    "assets/koru-autopilot-vscode/*.vsix",
    "assets/koru-autopilot-vscodium/*.vsix",
    "assets/*.json",
    "data/koru-interface-registry.yaml",
    "wizard/strategies.json",
    "wizard/templates/*.json",
    "wizard/gui/templates/*.html",
    "wizard/gui/static/*",
    "*.proto",
]
koruapi = ["dashboard_template.html"]
korumesh = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "packages/coru/src",
    "packages/koruenv/src",
    "packages/nlpshim/src",
    "packages/dsl2koru/src",
    "packages/uri2koru/src",
    "packages/nlp2koru/src",
    "packages/cli2koru/src",
    "packages/mcp2koru/src",
    "packages/rest2koru/src",
]
addopts = ["-m", "not slow"]
markers = [
    "slow: marks slow/integration tests (deselect with -m not slow)",
]

[tool.ruff]
target-version = "py312"
# 120 matches pfix and fits the agent-generated long f-strings; at 100 the
# repo carried 489 E501s, at 120 it is 71 (STARTER-553).
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/deep/deep-v4-pro"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration (requires optional dep: pip install -e ".[dev]")
badge = false
update_readme = true
readme_path = "README.md"
default_model = "openrouter/deep/deep-v4-pro"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.importlinter]
root_packages = ["koru", "koruide", "korumesh", "koruapi"]

# Aspirational (currently violated, tracked in STARTER-549/551):
# koruide must stop importing koru.autonomous_* / koru.autonomy_strategy
# (3 sites: daemon/metadata.py, daemon/handlers_drive.py, command_picker.py).

[[tool.importlinter.contracts]]
name = "koru.queue is a lower layer: no autonomy or daemon imports"
type = "forbidden"
source_modules = ["koru.queue"]
forbidden_modules = [
    "koru.autonomy",
    "koru.autonomy_strategy",
    "koru.autonomous_cycle",
    "koruide",
]

[[tool.importlinter.contracts]]
name = "korumesh does not depend on the IDE daemon layer"
type = "forbidden"
source_modules = ["korumesh"]
forbidden_modules = ["koruide"]
# Direct imports only: the one indirect chain (korumesh.cli_commands ->
# koru.configurator -> koruide.ide) is koru.configurator's dependency,
# tracked under the STARTER-549 layering cleanup.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "koruide daemon protocol stays self-contained"
type = "forbidden"
source_modules = ["koruide.daemon.protocol"]
forbidden_modules = ["koruide.daemon.handlers", "koru"]
