[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koru"
version = "0.1.309"
description = "Closed-loop automation across semcod/* repositories."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Semcod" }, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
keywords = ["automation", "refactor", "semcod", "koru", "closed-loop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "rich>=14.3.4",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/semcod/koru"
Issues = "https://github.com/semcod/koru/issues"
Repository = "https://github.com/semcod/koru"

[project.optional-dependencies]
watch = [
    "websockets>=12.0,<17.0",
]
vision = [
    "mss>=9.0,<11.0",
]
mesh = [
    "websockets>=12.0,<17.0",
]
observe = [
    "mss>=9.0,<11.0",
    "websockets>=12.0,<17.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-rerunfailures>=14.0,<17.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-xdist>=3.0,<4.0",
    "ruff>=0.11,<0.16",
    "mypy>=1.11,<3.0",
    "pyright>=1.1.390,<2.0",
    "hypothesis>=6.112,<7.0",
    "pre-commit>=3.8,<5.0",
    "types-PyYAML>=6.0,<7.0",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
    "tagi>=0.49.0",
]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "prometheus-client>=0.21,<1.0",
]
agent = [
    "instructor>=1.6,<2.0",
    "litellm>=1.51,<2.0",
    "openai>=1.54,<3.0",
    "tiktoken>=0.8,<1.0",
]
obs = [
    "nfo>=0.2.22,<1.0",
    "opentelemetry-exporter-otlp>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.49b0,<1.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "sentry-sdk>=2.18,<3.0",
    "structlog>=24.4,<26.0",
]
queue = [
    "apscheduler>=3.10,<4.0",
    "arq>=0.26,<1.0",
    "redis>=5.1,<8.0",
]
quality = [
    "import-linter>=2.0,<3.0",
    "mutmut>=3.2,<4.0",
    "pyupgrade>=3.17,<4.0",
    "refurb>=2.0,<3.0",
]
all = [
    "apscheduler>=3.10,<4.0",
    "arq>=0.26,<1.0",
    "fastapi>=0.115,<1.0",
    "hypothesis>=6.112,<7.0",
    "httpx>=0.27,<1.0",
    "import-linter>=2.0,<3.0",
    "instructor>=1.6,<2.0",
    "litellm>=1.51,<2.0",
    "mutmut>=3.2,<4.0",
    "mypy>=1.11,<3.0",
    "mss>=9.0,<11.0",
    "nfo>=0.2.22,<1.0",
    "openai>=1.54,<3.0",
    "opentelemetry-exporter-otlp>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.49b0,<1.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "pre-commit>=3.8,<5.0",
    "prometheus-client>=0.21,<1.0",
    "pyright>=1.1.390,<2.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-rerunfailures>=14.0,<17.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-xdist>=3.0,<4.0",
    "pyupgrade>=3.17,<4.0",
