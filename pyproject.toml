    "sentry-sdk>=2.18,<3.0",
    "structlog>=24.4,<26.0",
    "tiktoken>=0.8,<1.0",
    "types-PyYAML>=6.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
    "websockets>=12.0,<17.0",
    "goal>=2.1.0",
