[project.scripts]
koru = "koru.cli:main"
koru-wup-testql = "koru.wup_testql_compat:main"
koru-dsl = "korudsl.cli:main"
koru-api = "koruapi.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
koru = [
    "scripts/*.sh",
    "assets/koru-autopilot-vscode/*.vsix",
    "assets/*.json",
    "data/koru-interface-registry.yaml",
    "wizard/strategies.json",
    "wizard/templates/*.json",
    "wizard/gui/templates/*.html",
    "wizard/gui/static/*",
]
koruapi = ["dashboard_template.html"]
korumesh = ["grid_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not slow"]
markers = [
    "slow: marks slow/integration tests (deselect with -m not slow)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration (requires optional dep: pip install -e ".[dev]")
badge = false
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
