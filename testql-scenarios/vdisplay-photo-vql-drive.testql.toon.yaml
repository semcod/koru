# SCENARIO: Photo-VQL drive contract (SUMD autonomy loop)
# TYPE: integration
# Guards against false ok:true when capture mismatch / bad VQL / missing verify.
# Runs fast unit tests only (no desktop / no real paste).

CONFIG[2]{key, value}:
  timeout_ms, 120000
  workdir, ${KORU_ROOT:-.}

SHELL "PYTHONPATH=src python -m pytest tests/test_photo_vql_drive.py -q --noconftest -k 'validate_vql or map_on_mismatch or capture_provenance or rejects_small_background or penalizes_terminal'" 120000
ASSERT_EXIT_CODE 0
