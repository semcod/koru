version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: cron
    cronjob: 47 4 * * *
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  versioning-strategy: increase-if-necessary
  allow:
  - dependency-name: koruenv
    dependency-type: all
  - dependency-name: korullm
    dependency-type: all
  - dependency-name: mcp2koru
    dependency-type: all
  groups:
    internal-packages:
      patterns:
      - koruenv
      - korullm
      - mcp2koru
  commit-message:
    prefix: "chore(deps)"
