name: coru CI

on:
  pull_request:
    paths:
      - "packages/coru/**"
      - ".github/workflows/coru-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "packages/coru/**"
      - ".github/workflows/coru-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/coru/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/coru pytest

      - name: Run coru package tests
        run: python -m pytest packages/coru/tests -q

      - name: CLI smoke
        run: |
          coru ensure || true
          coru text "status for windsurf-main in windsurf" || true
