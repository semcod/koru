name: Generated Artifact Snapshot

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: generated-artifacts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analysis:
    name: Generate analysis artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install registry-pinned generators
        run: |
          python -m pip install --disable-pip-version-check \
            "code2llm==0.5.176" \
            "sumd==0.3.60"

      - name: Generate analysis outside the checkout
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/koru-analysis
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACT_ROOT}/project"
          code2llm . -f all -o "${ARTIFACT_ROOT}/project" \
            --no-chunk --exclude '*.md'
          sumd map . --stdout > "${ARTIFACT_ROOT}/SUMD.md"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_ROOT"])
          payload = {
              "schema": "koru.generated-analysis-run/v1",
              "sourceSha": os.environ["GITHUB_SHA"],
              "generators": {
                  "code2llm": "0.5.176",
                  "sumd": "0.3.60",
              },
              "gitStatus": subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=no"],
                  text=True,
              ),
          }
          (root / "run.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: koru-analysis-${{ github.sha }}
          path: ${{ runner.temp }}/koru-analysis
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Generate coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install package and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Generate coverage outside the checkout
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/koru-coverage
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACT_ROOT}"
          python -m coverage run -m pytest tests/ -q
          python -m coverage json -o "${ARTIFACT_ROOT}/coverage.json"
          python -m coverage xml -o "${ARTIFACT_ROOT}/coverage.xml"
          cp .coverage "${ARTIFACT_ROOT}/coverage.data"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: koru-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/koru-coverage
          if-no-files-found: error
          retention-days: 14

  media:
    name: Publish verified baseline media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source and accepted history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Recover and verify accepted media
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/koru-media
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACT_ROOT}"
          source_commit=$(python -c \
            'import json; print(json.load(open("config/artifact-registry.json"))["baseline"]["sourceCommit"])')
          expected_digest=$(python -c \
            'import json; data=json.load(open("config/artifact-registry.json")); print(next(group["digest"] for group in data["artifactGroups"] if group["id"] == "release-media"))')
          git show "${source_commit}:koru.mp4" > "${ARTIFACT_ROOT}/koru.mp4"
          file_digest=$(sha256sum "${ARTIFACT_ROOT}/koru.mp4" | cut -d' ' -f1)
          group_digest=$(printf '%s  koru.mp4\n' "${file_digest}" | sha256sum | cut -d' ' -f1)
          test "${group_digest}" = "${expected_digest}"
          printf '%s  koru.mp4\n' "${file_digest}" > "${ARTIFACT_ROOT}/SHA256SUMS"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload verified media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: koru-media-${{ github.sha }}
          path: ${{ runner.temp }}/koru-media
          if-no-files-found: error
          retention-days: 14
