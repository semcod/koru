# Thin CI smoke (Epic 2 — copy/adapt for consumer repos; see docs/ci-github.md).
name: Koru CI (smoke)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Governance validates the exact accepted base, which may predate the
          # pull request's immediate merge base.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (koru package only)
        run: python -m ruff check src/koru

      - name: Pytest (fast subset)
        run: |
          python -m pytest tests/test_init.py tests/test_autopilot_cli.py -q

      - name: CLI smoke
        run: |
          koru --help
          python -m koru --doctor --project .
