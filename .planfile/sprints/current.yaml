        notes:
        - 'Diagnosis 2026-07-03: two daemons listened on instance ''vscodium'' — pid
          2516221 (project c2004, started Jul 2 17:46) held an UNLINKED socket fd
          while pid 4083428 (project semcod/koru, Jul 2 23:28) owned the on-disk socket
          file. Result: c2004 clients resolving koru-autopilot-vscodium.sock reached
          a daemon bound to a DIFFERENT project. Root cause: daemon startup rebinds
          the socket path (unlink+bind) without reaping the previous owner; --idempotent
          only prevents same-invocation duplicates. Fix directions: (1) on startup,
          if socket is live and owned by another pid, either adopt or shut it down
          via protocol before rebinding; (2) readiness/doctor check: for each koru-autopilot*.sock
          compare on-disk inode owner vs all listening processes (ss -xlp), flag orphans;
          (3) verify daemon_project_mismatch check fires for cross-project sockets.
          Orphan pid 2516221 left running (operator decision needed): kill 2516221'
        - '2026-07-03 evening: incident reproduced on c2004 — koru auto reused the
          vscode daemon whose project=semcod/koru and plugin workspaceFolders=[semcod/koru];
          startup readiness printed [FAIL] daemon_project_mismatch + plugin_workspace_mismatch
          but the loop STILL drove prompts into the foreign IDE window. Enforcement
          implemented in working tree (autonomy/cycle/cycle_drive_retry.py): _client_has_usable_plugin
          now takes project and refuses the plugin when workspaceFolders do not cover
          it (override KORU_AUTOPILOT_ALLOW_WORKSPACE_MISMATCH=1); orchestrator plugin
          gate passes project; plugin_skip_code maps to plugin_workspace_mismatch.
          NOTE: edit rides on top of the in-flight cycle_* migration — include when
          stabilizing; add tests (cross-project blocked / own project ok / override).'
        - 'Gate semantics narrowed after full-suite run: _client_has_usable_plugin
          blocks only on a POSITIVE workspace conflict (plugin reports workspaceFolders
          and none covers the project, both containment directions checked); plugins
          without workspaceFolders (older builds, test fakes) pass the drive gate
          — readiness still surfaces the missing info separately. Helper _plugin_workspace_conflict
