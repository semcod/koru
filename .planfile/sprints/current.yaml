          -i 's/os\\.environ\\[\\([^]]*\\)\\]/AutonomousContext.get_current().env_overrides.get(\\1,
          os.environ.get(\\1))/g' src/koru_tillm_client.py\nsed -i 's/os\\.environ\\.get(\\([^,]*\\),
