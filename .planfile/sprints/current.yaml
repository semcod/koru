          dependencies beyond stdlib.\n\n---\n\n### Action Plan\n\n#### 1. Create
          `AutonomousContext` class  \n**File**: `src/autonomous_context.py`  \n```bash\nmkdir
          -p src && cat > src/autonomous_context.py << 'EOF'\nfrom contextvars import
          ContextVar\nfrom typing import Optional, Dict, Any\n\nclass AutonomousContext:\n
          \   _instance: ContextVar[Optional['AutonomousContext']] = ContextVar('autonomous_context',
          default=None)\n\n    def __init__(self, env_overrides: Optional[Dict[str,
          str]] = None):\n        self.env_overrides = env_overrides or {}\n\n    @classmethod\n
          \   def get_current(cls) -> 'AutonomousContext':\n        ctx = cls._instance.get()\n
          \       if ctx is None:\n            raise RuntimeError(\"AutonomousContext
          not set in current context\")\n        return ctx\n\n    @classmethod\n
          \   def set_current(cls, ctx: 'AutonomousContext') -> None:\n        cls._instance.set(ctx)\n\n
          \   def apply_to_env(self, env: Dict[str, str]) -> Dict[str, str]:\n        \"\"\"Return
          a copy of `env` with overrides applied.\"\"\"\n        result = env.copy()\n
          \       result.update(self.env_overrides)\n        return result\nEOF\n```\n\n####
          2. Replace direct `os.environ` usage in modules  \n**Pattern**: Replace
          `os.environ[...]` / `os.environ.get(...)` with `AutonomousContext.get_current().env_overrides.get(...)`
          or `os.environ[...]` *only* if fallback to process env is acceptable (rare).
          Prefer explicit context propagation.\n\n**Files to modify** (example edits):\n\n-
          **`src/koru_tillm_client.py`**  \n```bash\nsed -i 's/^import os$/import
