      inputs:
        llm_model: qwen/qwen3-coder-next
        llm_timeout_seconds: 180.0
      labels:
      - release
      name: 'R-F3.1: Single-source versioning via setuptools dynamic version'
      outputs:
        artifacts:
        - .planfile/artifacts/openrouter/STARTER-556.md
        notes:
        - "OPENROUTER-LLM qwen/qwen3-coder-next\n\n**Assumptions**  \n1. Project uses
          `semver`-style versioning in a top-level `VERSION` file (e.g., `0.1.36`).
          \ \n2. `pyproject.toml` currently has `dynamic = [\"version\"]` and a `tool.uv`/`tool.poetry`
          section referencing `VERSION` manually (or via script).  \n3. `__init__.py`
          contains a hardcoded `__version__ = \"...\"` (or imports from a `version.py`).
          \ \n4. `uv.lock` is generated by `uv` and must stay in sync with `pyproject.toml`
          version.  \n5. Goal: eliminate manual sync (e.g., no `scripts/sync_version.py`
          or `setuptools-scm`), use `dynamic = [\"version\"]` with `version = { read
          = \"VERSION\" }` (PEP 621 + uv 0.4+ support).  \n6. All packages are in
          a monorepo under `src/` (adjust if different).  \n\n---\n\n### Action Plan
          (≤10 steps, executable)\n\n1. **Ensure `VERSION` file exists and is valid**
          \ \n   ```bash\n   echo \"0.1.37\" > VERSION  # or verify current version\n
          \  ```\n\n2. **Update `pyproject.toml`**  \n   Replace any static `version
          = \"...\"` or `tool.poetry.version` with:  \n   ```toml\n   [project]\n
          \  dynamic = [\"version\"]\n   \n   [tool.uv]\n   # Optional: if using uv
          for publishing, ensure it reads VERSION\n   # (uv respects PEP 621 dynamic
          version via `version.read` as of 0.4.20+)\n   ```\n   Add PEP 621-compliant
          dynamic version source:  \n   ```toml\n   [project]\n   dynamic = [\"version\"]\n
          \  \n   [tool.uv]\n   # No extra config needed — uv auto-reads `version.read`
          from [project]\n   \n   [project]  # if not already present\n   version
          = { read = \"VERSION\" }\n   ```\n   > ✅ **Critical**: `version = { read
          = \"VERSION\" }` must be under `[project]`, *not* `[tool.*]`.\n\n3. **Remove
          hardcoded `__version__` from `__init__.py`**  \n   Replace:  \n   ```python\n
          \  __version__ = \"0.1.36\"\n   ```  \n   With:  \n   ```python\n   from
          importlib.metadata import version, PackageNotFoundError\n   try:\n       __version__
          = version(\"your-package-name\")\n   except PackageNotFoundError:\n       __version__
          = \"0.0.0\"  # fallback for dev installs\n   ```\n\n4. **Delete any legacy
          sync scripts or `version.py`**  \n   ```bash\n   rm -f scripts/sync_version.py
          src/your_package/version.py\n   ```\n\n5. **Regenerate `uv.lock` to embed
          dynamic version**  \n   ```bash\n   uv lock --no-build-isolation  # ensures
          lock reflects dynamic version\n   ```\n\n6. **Verify lockfile version matches
          `VERSION`**  \n   ```bash\n   grep -A1 '\\[metadata\\]' uv.lock | grep 'version'
          | cut -d'\"' -f2\n   # Should match $(cat VERSION)\n   ```\n\n7. **Test
          install + version resolution**  \n   ```bash\n   uv pip install -e . &&
          python -c \"import your_package; print(your_package.__version__)\"\n   #
          Output must equal $(cat VERSION)\n   ```\n\n8. **Update CI/CD publish step**
          \ \n   Ensure publish uses `uv publish` (or `twine` *after* `uv build`),
          *not* manual version injection:  \n   ```yaml\n   # .github/workflows/publish.yml\n
          \  - run: uv build\n   - run: uv publish --token ${{ secrets.PYPI_TOKEN
          }}\n   ```\n\n9. **Add pre-commit hook to prevent drift**  \n   ```bash\n
          \  # .pre-commit-config.yaml\n   repos:\n     - repo: local\n       hooks:\n
          \        - id: version-sync\n           name: Check VERSION == pyproject.toml
          version\n           entry: bash -c 'v=$(cat VERSION); p=$(grep -E \"^version
          = \" pyproject.toml | cut -d\"\\\"\" -f2); [ \"$v\" = \"$p\" ] || { echo
          \"Drift: VERSION=$v, pyproject=$p\"; exit 1; }'\n           language: system\n
          \          files: ^VERSION$|^pyproject\\.toml$\n   ```\n\n10. **Document
          in `CONTRIBUTING.md`**  \n    ```markdown\n    ## Versioning  \n    - Version
          is defined **only** in `VERSION`.  \n    - `pyproject.toml` uses `version
          = { read = \"VERSION\" }`.  \n    - `__init__.py` reads version via `importlib.metadata`.
          \ \n    - Run `uv lock` after changing `VERSION`.\n    ```\n\n---\n\n**Result**:
          `VERSION` is the single source of truth. `pyproject.toml`, `__init__.py`,
          and `uv.lock` auto-sync via PEP 621 + uv. No manual sync class needed."
