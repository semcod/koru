          \ \n2. Files are edited in-place by the CLI (e.g., `config.yaml`, `settings.json`).
          \ \n3. Audit log is a single file: `/var/log/koru_audit.log`.  \n4. Per-project
          consent/dry-run levels: `none`, `dry-run`, `consent`, `execute`.  \n5. Project
          root = current working directory; config stored in `.koru/config.json`.
          \ \n\n---\n\n### Action Plan\n\n1. **Create project config structure**  \n
          \  ```bash\n   mkdir -p .koru && echo '{\"level\": \"dry-run\"}' > .koru/config.json\n
          \  ```\n\n2. **Create wrapper script `koru-run` (in `$PATH`, e.g., `/usr/local/bin/koru-run`)**
          \ \n   ```bash\n   cat > /usr/local/bin/koru-run << 'EOF'\n   #!/bin/bash\n
          \  set -euo pipefail\n\n   PROJECT_ROOT=\"$(pwd)\"\n   CONFIG_FILE=\"$PROJECT_ROOT/.koru/config.json\"\n
          \  AUDIT_LOG=\"/var/log/koru_audit.log\"\n\n   # Read consent/dry-run level
          (default: dry-run)\n   LEVEL=$(jq -r '.level // \"dry-run\"' \"$CONFIG_FILE\"
          2>/dev/null || echo \"dry-run\")\n\n   # Validate level\n   case \"$LEVEL\"
          in\n     none|dry-run|consent|execute) ;;\n     *) echo \"ERROR: Invalid
          level '$LEVEL' in $CONFIG_FILE\"; exit 1 ;;\n   esac\n\n   # Prompt for
          consent if level=consent\n   if [[ \"$LEVEL\" == \"consent\" ]]; then\n
          \    echo \"Profile '$KORU_TILLM_EXECUTE_PROFILE' will be executed. Proceed?
          [y/N]\"\n     read -r ans\n     [[ \"$ans\" =~ ^[Yy]$ ]] || { echo \"Aborted.\";
          exit 1; }\n   fi\n\n   # Dry-run: simulate only\n   if [[ \"$LEVEL\" ==
          \"dry-run\" ]]; then\n     echo \"[AUDIT] $(date -Iseconds) DRY-RUN profile=$KORU_TILLM_EXECUTE_PROFILE
          dir=$PROJECT_ROOT\" >> \"$AUDIT_LOG\"\n     echo \"DRY-RUN: Would run: vendor-cli
          --profile $KORU_TILLM_EXECUTE_PROFILE\"\n     exit 0\n   fi\n\n   # Execute
          (level=execute or none)\n   if [[ \"$LEVEL\" == \"execute\" || \"$LEVEL\"
