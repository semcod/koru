          ..autonomous_context import AutonomousContext/' src/lanes/exports.py\n#
          Apply same pattern as above\n```\n\n- **`src/autonomous_socket.py`** (rename
          if `socket.py` is stdlib shadow)  \n```bash\ncat > src/autonomous_socket.py
          << 'EOF'\nimport os\nimport socket as _socket\nfrom .autonomous_context
          import AutonomousContext\n\nclass Socket(_socket.socket):\n    def connect(self,
          *args, **kwargs):\n        # Example: inject env-based socket options if
          needed\n        ctx = AutonomousContext.get_current()\n        # ... apply
          context-specific behavior ...\n        return super().connect(*args, **kwargs)\nEOF\n```\n>
          Replace all `import socket` → `from .autonomous_socket import Socket` in
          dependent modules.\n\n#### 3. Introduce `AutonomousContext` at subprocess
          boundaries  \n**File**: `src/subprocess_utils.py`  \n```bash\ncat > src/subprocess_utils.py
          << 'EOF'\nimport os\nimport subprocess\nfrom .autonomous_context import
          AutonomousContext\n\ndef run_with_context(cmd, **kwargs):\n    ctx = AutonomousContext.get_current()\n
          \   env = kwargs.pop('env', os.environ.copy())\n    env = ctx.apply_to_env(env)\n
          \   return subprocess.run(cmd, env=env, **kwargs)\n\ndef Popen_with_context(cmd,
          **kwargs):\n    ctx = AutonomousContext.get_current()\n    env = kwargs.pop('env',
          os.environ.copy())\n    env = ctx.apply_to_env(env)\n    return subprocess.Popen(cmd,
          env=env, **kwargs)\nEOF\n```\n\n#### 4. Update entry points to set `AutonomousContext`
