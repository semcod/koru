        - "OPENROUTER-LLM qwen/qwen3-coder-next\n\n**Assumptions**  \n1. `--idempotent`
          is a custom flag in the koru autopilot daemon (e.g., checks for existing
          PID or socket).  \n2. Daemons are started via a script (e.g., `start.sh`)
          that *does not* enforce idempotency correctly.  \n3. Each daemon binds to
          a unique socket (e.g., `/run/koru/daemon-<id>.sock`).  \n4. No external
          process manager (e.g., systemd) is managing lifecycle.  \n5. `--idempotent`
          likely checks for *any* running daemon, not *this specific instance*.\n\n---\n\n###
          **Diagnosis Steps**\n\n1. **Inspect daemon startup script**  \n   ```bash\n
          \  grep -r \"idempotent\" . --include=\"*.sh\" --include=\"*.py\" --include=\"*.go\"\n
          \  ```\n   → Look for logic like `if [ -f /run/koru/daemon.pid ]; then exit
          0; fi`.  \n   → **Root cause likely**: `--idempotent` checks for *any* daemon
          PID, not per-socket/per-instance.\n\n2. **Check running processes & sockets**
          \ \n   ```bash\n   ps aux | grep koru | grep -v grep\n   ls -l /run/koru/*.sock
          2>/dev/null || echo \"No sockets found\"\n   ss -xlnp | grep koru\n   ```\n
          \  → If multiple daemons run *and* bind to *different* sockets, `--idempotent`
          is not instance-aware.\n\n3. **Verify socket binding logic**  \n   ```bash\n
          \  grep -r \"bind.*sock\" . --include=\"*.go\" --include=\"*.py\" --include=\"*.c\"\n
          \  ```\n   → Confirm each daemon binds to a *unique* socket (e.g., `socket_path
          = f\"/run/koru/daemon-{id}.sock\"`).\n\n---\n\n### **Fix Plan**\n\n####
          **A. Patch `--idempotent` to check *per-socket* existence**\n**File**: `src/daemon/main.go`
          (example; adjust to your language)  \n**Change**: Replace global PID check
          with socket-specific check.\n\n```go\n// BEFORE (likely):\nif _, err :=
          os.Stat(\"/run/koru/daemon.pid\"); err == nil {\n    log.Fatal(\"Daemon
          already running (idempotent)\")\n}\n\n// AFTER:\nsocketPath := fmt.Sprintf(\"/run/koru/daemon-%s.sock\",
          instanceID)\nif _, err := os.Stat(socketPath); err == nil {\n    // Check
          if socket is *active* (not stale)\n    conn, err := net.Dial(\"unix\", socketPath)\n
          \   if err == nil {\n        conn.Close()\n        log.Fatalf(\"Daemon for
          instance %s already running\", instanceID)\n    }\n    // Stale socket:
          remove and proceed\n    os.Remove(socketPath)\n}\n```\n\n#### **B. Ensure
          socket path is instance-unique**\n**File**: `src/daemon/config.go` (or equivalent)
          \ \n**Add**:\n```go\ninstanceID := os.Getenv(\"KORU_INSTANCE_ID\") // or
          parse from --id flag\nif instanceID == \"\" {\n    log.Fatal(\"KORU_INSTANCE_ID
          must be set\")\n}\nsocketPath := fmt.Sprintf(\"/run/koru/daemon-%s.sock\",
          instanceID)\n```\n\n#### **C. Add doctor/readiness check**\n**File**: `scripts/doctor.sh`
          (new file)\n```bash\n#!/bin/bash\nset -e\n\nSOCK_DIR=\"/run/koru\"\nDUPLICATES=0\n\nfor
          sock in \"$SOCK_DIR\"/daemon-*.sock; do\n    [ -e \"$sock\" ] || continue\n
          \   # Check if socket is bound by a live process\n    if ss -xlnp 2>/dev/null
          | grep -qF \"$sock\"; then\n        # Count processes bound to this socket\n
          \       PIDS=$(ss -xlnp 2>/dev/null | awk -v s=\"$sock\" '$4 == s {print
          $6}' | tr -d '()' | sort -u)\n        if [ $(echo \"$PIDS\" | wc -l) -gt
          1 ]; then\n            echo \"ERROR: Duplicate daemons on $sock: PIDs $PIDS\"\n
          \           DUPLICATES=1\n        fi\n    fi\ndone\n\nif [ $DUPLICATES -eq
          1 ]; then\n    echo \"DOCTOR: FAIL — duplicate daemons detected\"\n    exit
          1\nelse\n    echo \"DOCTOR: PASS — no duplicates\"\n    exit 0\nfi\n```\n\nMake
          executable:\n```bash\nchmod +x scripts/doctor.sh\n```\n\n#### **D. Update
          startup script to enforce uniqueness**\n**File**: `start.sh`  \n**Add**:\n```bash\n#!/bin/bash\nset
          -e\n\nINSTANCE_ID=\"$1\"\n[ -z \"$INSTANCE_ID\" ] && { echo \"Usage: $0
          <instance_id>\"; exit 1; }\n\nexport KORU_INSTANCE_ID=\"$INSTANCE_ID\"\n\n#
          Run doctor check before starting\n./scripts/doctor.sh || { echo \"Refusing
          to start: duplicates exist\"; exit 1; }\n\n# Start daemon with --idempotent\n./bin/koru-daemon
          --idempotent --socket \"/run/koru/daemon-${INSTANCE_ID}.sock\"\n```\n\n####
          **E. Verify fix**\n```bash\n# Start 3 instances\n./start.sh 1 &\n./start.sh
          2 &\n./start.sh 3 &\n\n# Check for duplicates\n./scripts/doctor.sh\n\n#
          Confirm only 3 daemons\nps aux | grep koru | grep -v grep | wc -l\n```\n\n---\n\n**Expected
          outcome**:  \n- `--idempotent` now checks *per-socket*, preventing duplicate
          *per instance*.  \n- `doctor.sh` flags duplicates per socket.  \n- No stale
          sockets left behind (cleaned on startup)."
