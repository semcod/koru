      id: STARTER-564
      inputs:
        llm_model: qwen/qwen3-coder-next
        llm_timeout_seconds: 180.0
      labels:
      - tests
      - refactor
      name: 'Guard: facade late-binding contract test'
      outputs:
        artifacts:
        - .planfile/artifacts/openrouter/STARTER-564.md
        notes:
        - 'Parts 1-2 done (commit follows f51cccb): tests/test_facade_late_binding_contract.py
          — collector + facade-exposure assertion + sentinel self-checks; negative
          test confirmed it flags a dropped export precisely. Part 3 (audit that call
          sites of test-patched names route through facades) remains.'
        - "OPENROUTER-LLM qwen/qwen3-coder-next\n\n**Assumptions**  \n1. Project uses
          `src/` as source root, `tests/` as test root.  \n2. Late-bound facade attributes
          follow pattern: `_cycle_mod`, `_runner_mod`, `_readiness_facade`, etc. (i.e.,
          underscore-prefixed, `_mod`/`_facade` suffix).  \n3. Facades are defined
          in `src/tillm/registry/facades.py` (adjust if different; default assumed).
          \ \n4. Tests use `pytest`; monkeypatches are via `monkeypatch` fixture.
          \ \n5. `coru/cli 19`, `readiness`, `autonomous_cycle` are concrete modules
          in `src/`.  \n\n---\n\n### Action Plan (≤15 min execution)\n\n#### 1. Create
          contract test template  \n```bash\nmkdir -p tests\ncat > tests/test_tillm_registry_contract.py
          << 'EOF'\n\"\"\"Contract test: late-bound facade attributes must be exposed
          and resolvable.\"\"\"\nimport ast\nimport os\nfrom pathlib import Path\nfrom
          types import ModuleType\n\nimport pytest\n\nSRC_ROOT = Path(\"src\")\nFACADE_PATH
          = SRC_ROOT / \"tillm\" / \"registry\" / \"facades.py\"\nFACADE_MODULE_NAME
          = \"tillm.registry.facades\"\n\n\ndef _collect_late_bound_refs() -> set[str]:\n
          \   \"\"\"Find all `_cycle_mod`, `_runner_mod`, `_readiness_facade`-style
          refs in src/.\"\"\"\n    pattern = \"_*_(mod|facade)$\"\n    refs = set()\n
          \   for path in SRC_ROOT.rglob(\"*.py\"):\n        if \"test\" in str(path)
          or \"__pycache__\" in str(path):\n            continue\n        tree = ast.parse(path.read_text(),
          filename=str(path))\n        for node in ast.walk(tree):\n            if
          isinstance(node, ast.Attribute):\n                if isinstance(node.value,
          ast.Name) and node.attr.startswith(\"_\"):\n                    if node.attr.endswith(\"_mod\")
          or node.attr.endswith(\"_facade\"):\n                        refs.add(node.attr)\n
          \   return refs\n\n\ndef _collect_monkeypatch_targets() -> set[tuple[str,
          str]]:\n    \"\"\"Find all `monkeypatch.setattr(facade, name, ...)` in tests/.\"\"\"\n
          \   targets = set()\n    for path in Path(\"tests\").rglob(\"*.py\"):\n
          \       tree = ast.parse(path.read_text(), filename=str(path))\n        for
          node in ast.walk(tree):\n            if (\n                isinstance(node,
          ast.Call)\n                and isinstance(node.func, ast.Attribute)\n                and
          node.func.attr == \"setattr\"\n                and len(node.args) >= 2\n
          \           ):\n                # Expect: monkeypatch.setattr(facade_module,
          \"attr_name\", ...)\n                if isinstance(node.args[0], ast.Attribute):\n
          \                   mod_name = ast.unparse(node.args[0].value)\n                    attr_name
          = node.args[0].attr\n                elif isinstance(node.args[0], ast.Name):\n
          \                   mod_name = node.args[0].id\n                    attr_name
          = node.args[1].value if isinstance(node.args[1], ast.Constant) else None\n
          \               else:\n                    continue\n                if
          mod_name == FACADE_MODULE_NAME and attr_name:\n                    targets.add((mod_name,
          attr_name))\n    return targets\n\n\ndef _load_facade_module() -> ModuleType:\n
          \   import importlib\n    return importlib.import_module(FACADE_MODULE_NAME)\n\n\ndef
          test_facade_exposes_all_late_bound_refs():\n    \"\"\"Assert facade module
          exposes every late-bound attribute found in src/.\"\"\"\n    refs = _collect_late_bound_refs()\n
          \   facade = _load_facade_module()\n    missing = [r for r in refs if not
          hasattr(facade, r)]\n    assert not missing, f\"Facade missing late-bound
          attrs: {missing}\"\n\n\ndef test_monkeypatch_targets_resolve_through_facade():\n
          \   \"\"\"Assert every monkeypatch target in tests/ resolves via the facade.\"\"\"\n
          \   targets = _collect_monkeypatch_targets()\n    facade = _load_facade_module()\n
          \   unresolved = []\n    for mod_name, attr in targets:\n        if not
          hasattr(facade, attr):\n            unresolved.append(f\"{mod_name}.{attr}\")\n
          \   assert not unresolved, f\"Monkeypatch targets not exposed by facade:
          {unresolved}\"\nEOF\n```\n\n\n#### 2. Run test to confirm it fails (red)
          on current codebase  \n```bash\npytest tests/test_tillm_registry_contract.py
          -v\n# Expected: FAIL (missing late-bound attrs)\n```\n\n\n#### 3. Fix the
          facade (if needed)  \n- Edit `src/tillm/registry/facades.py` to expose all
          missing attributes (e.g., `from coru.cli import _cycle_mod as _cycle_mod`).
          \ \n- Re-run test until green:  \n```bash\npytest tests/test_tillm_registry_contract.py
          -v\n```\n\n\n#### 4. Commit test + fix  \n```bash\ngit add tests/test_tillm_registry_contract.py
          src/tillm/registry/facades.py\ngit commit -m \"test: add contract test for
          late-bound facade attributes\"\n```"
