# WUP Configuration for CLI Testing
# Generated automatically by wup init-cli
# Project: koru

project:
  name: koru
  description: CLI testing for koru
watch:
  paths:
  - '**'
  exclude_patterns:
  - '*.md'
  - tests/**
  - .venv/**
  - venv/**
  - node_modules/**
  file_types:
  - .py
services:
- name: koru-shell
  type: shell
  paths: []
  root: /home/tom/github/semcod/koru
  quick_tests:
    scope: all
    max_endpoints: 4
  detail_tests:
    scope: all
    max_endpoints: 8
test_strategy:
  quick:
    debounce_s: 2
    max_queue: 5
    timeout_s: 30
  detail:
    debounce_s: 10
    max_queue: 1
    timeout_s: 60
testql:
  scenario_dir: testql-scenarios
  smoke_scenario: cli-smoke.testql.toon.yaml
  output_format: json
  probe_interval_s: 60

