services:
  koru:
    build:
      context: .
      target: production
    container_name: koru-test
    volumes:
      - ./test-data:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      - PYTHONPATH=/app/src
      - KORU_AUTOPILOT_IDE=auto
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: tail -f /dev/null
    profiles:
      - test

  koru-dev:
    build:
      context: .
      target: development
    container_name: koru-dev
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    environment:
      - PYTHONPATH=/app/src
      - KORU_AUTOPILOT_IDE=auto
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: bash
    profiles:
      - dev

  # Deterministic, offline verification lane used by the todo2code gate. It
  # deliberately creates no Compose network: source checks need only the
  # project mount and must still work on hosts with exhausted address pools.
  koru-verify:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    working_dir: /app
    network_mode: none
    environment:
      - PYTHONPATH=/app/src
    command: sh
    profiles:
      - verify

  # External dependencies for testing
  planfile:
    build:
      context: https://github.com/semcod/planfile.git#8e5e19c40a464f49844a6c9df542173cd67876a7
    container_name: planfile-test
    volumes:
      - ./test-data:/workspace
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    profiles:
      - deps

  regix:
    build:
      context: https://github.com/semcod/regix.git#ca098059ee97dc4b81d44f42fd24ec72f899c9e8
      dockerfile_inline: |
        FROM python@sha256:e5c9fa26ffb76e11e0f054f30dc2523a2f9693f0c36c0cf1e39b27e152d899fc
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir .
    container_name: regix-test
    volumes:
      - ./test-data:/workspace
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    profiles:
      - deps

  testql:
    build:
      context: https://github.com/autogrammar/testql.git#cc9171f2c702caa363b17f1a529ec41a88d038aa
    container_name: testql-test
    volumes:
      - ./test-data:/workspace
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    profiles:
      - deps

  healing-webhook:
    build:
      context: ./services/healing-webhook
    container_name: healing-webhook-test
    ports:
      - "8810:8810"
    volumes:
      - ./test-data:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REPO_PATH=/repo
      - DRY_RUN=true
      - PORT=8810
    profiles:
      - deps

networks:
  default:
    name: koru-test-network
