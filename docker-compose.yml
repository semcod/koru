services:
  koru:
    build:
      context: .
      target: production
    container_name: koru-test
    volumes:
      - ./test-data:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      - PYTHONPATH=/app/src
      - KORU_AUTOPILOT_IDE=auto
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: tail -f /dev/null
    profiles:
      - test

  koru-dev:
    build:
      context: .
      target: development
    container_name: koru-dev
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    environment:
      - PYTHONPATH=/app/src
      - KORU_AUTOPILOT_IDE=auto
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: bash
    profiles:
      - dev

  # Deterministic, offline verification lane used by the todo2code gate. It
  # deliberately creates no Compose network: source checks need only the
  # project mount and must still work on hosts with exhausted address pools.
  koru-verify:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    working_dir: /app
    network_mode: none
    environment:
      - PYTHONPATH=/app/src
    command: sh
    profiles:
      - verify

  # External dependencies for testing
  planfile:
    build:
      context: https://github.com/semcod/planfile.git#853a0d640b16a5b61b8d8ced1bf9a61f7475c102
    container_name: planfile-test
    volumes:
      - ./test-data:/workspace
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    profiles:
      - deps

  regix:
    build:
      context: https://github.com/semcod/regix.git#ca098059ee97dc4b81d44f42fd24ec72f899c9e8
      dockerfile_inline: |
        FROM ghcr.io/astral-sh/uv:0.11.28@sha256:0f36cb9361a3346885ca3677e3767016687b5a170c1a6b88465ec14aefec90aa AS uv
        FROM python:3.12.14-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
        COPY --from=uv /uv /uvx /bin/
        WORKDIR /app
        COPY pyproject.toml uv.lock README.md ./
        RUN uv lock --check --no-sources \
            && uv sync --frozen --no-dev --no-editable --no-install-project
        COPY regix ./regix
        RUN uv sync --frozen --no-dev --no-editable
        ENV PATH="/app/.venv/bin:$${PATH}"
    container_name: regix-test
    volumes:
      - ./test-data:/workspace
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    profiles:
      - deps

  testql:
    build:
      context: https://github.com/autogrammar/testql.git#d08d033607eb57f9c094856d0fb0d1adef88c8d5
    container_name: testql-test
    volumes:
      - ./test-data:/workspace
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    profiles:
      - deps

  healing-webhook:
    build:
      context: .
      dockerfile: services/healing-webhook/Dockerfile
    container_name: healing-webhook-test
    ports:
      - "8810:8810"
    volumes:
      - ./test-data:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REPO_PATH=/repo
      - DRY_RUN=true
      - PORT=8810
    profiles:
      - deps

networks:
  default:
    name: koru-test-network
