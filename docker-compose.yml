services:
  koru:
    build:
      context: .
      target: production
    container_name: koru-test
    volumes:
      - ./test-data:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      - PYTHONPATH=/app/src
      - KORU_AUTOPILOT_IDE=auto
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: tail -f /dev/null
    profiles:
      - test

  koru-dev:
    build:
      context: .
      target: development
    container_name: koru-dev
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    environment:
      - PYTHONPATH=/app/src
      - KORU_AUTOPILOT_IDE=auto
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: bash
    profiles:
      - dev

  # Deterministic, offline verification lane used by the todo2code gate. It
  # deliberately creates no Compose network: source checks need only the
  # project mount and must still work on hosts with exhausted address pools.
  koru-verify:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    working_dir: /app
    network_mode: none
    environment:
      - PYTHONPATH=/app/src
    command: sh
    profiles:
      - verify

  # External dependencies for testing
  planfile:
    build:
      context: .
      target: development
    container_name: planfile-test
    volumes:
      - ./test-data:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    profiles:
      - deps

  regix:
    build:
      context: .
      target: development
    container_name: regix-test
    volumes:
      - ./test-data:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    profiles:
      - deps

  testql:
    build:
      context: .
      target: development
    container_name: testql-test
    volumes:
      - ./test-data:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    profiles:
      - deps

  healing-webhook:
    build:
      context: ./services/healing-webhook
    container_name: healing-webhook-test
    ports:
      - "8810:8810"
    volumes:
      - ./test-data:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REPO_PATH=/repo
      - DRY_RUN=true
      - PORT=8810
    profiles:
      - deps

networks:
  default:
    name: koru-test-network
