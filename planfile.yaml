      print(''VQL loaded, click_center:'', m.get(''ui_elements'',[{}])[0].get(''click_center'')
      if m.get(''ui_elements'') else ''n/a'')

      print(''vdisplay_available:'', vdisplay_available())

      # Example: send_chat(''Improve keeper delegation using VQL click coords from
