# Built-in task profiles for koru decide / koru work next (schema koru.task_profiles/v1)
schema: koru.task_profiles/v1
defaults:
  fallback_profile: god_module_split
  profile_order:
    - cc_hotspot_refactor
    - god_function_refactor
    - code_smell_refactor
    - taskand_operational
    - god_module_split
profiles:
  god_module_split:
    description: Split a god module into focused submodules by responsibility.
    match:
      labels_any: [god-module, refactor]
      signals_any: [code2llm_god, god_module]
      name_patterns: ['Split god module*', 'Split large module*']
    workflow:
      - id: inspect
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run --skip-gates'
      - id: refactor
        kind: ide_work
        auto: false
        hint: >-
          Split the flagged module into focused submodules; keep public API stable;
          run local gates before commit.
      - id: verify
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run'
      - id: publish
        kind: shell
        auto: true
        command: koru work finish --ticket {ticket_id} --no-publish --project {repo}

  cc_hotspot_refactor:
    description: Reduce cyclomatic complexity via dispatch maps / extraction.
    match:
      labels_any: [cyclomatic, complexity, refactor, regix]
      signals_any: [regix_cc, cyclomatic_complexity, code2llm_cc]
      name_patterns: ['Reduce cyclomatic complexity*']
    workflow:
      - id: baseline
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run --skip-gates'
      - id: refactor
        kind: ide_work
        auto: false
        hint: >-
          Extract helpers or dispatch tables until CC is below the gate limit;
          avoid behavior changes.
      - id: verify
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run'

  god_function_refactor:
    description: Decompose oversized god function into focused helper functions.
    match:
      labels_any: [god-function, code-smell]
      signals_any: [code2llm_smell_god_function]
      name_patterns: ['Address code smell: God Function*']
    workflow:
      - id: baseline
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run --skip-gates'
      - id: refactor
        kind: ide_work
        auto: false
        hint: >-
          Decompose the oversized function into small, focused helper functions;
          reduce cyclomatic complexity and mutations; preserve behavior and run local tests.
      - id: verify
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run'

  code_smell_refactor:
    description: Remediate structural code smells (shotgun surgery, data clump, feature envy).
    match:
      labels_any: [code-smell, smell, shotgun-surgery, data-clump, feature-envy]
      signals_any:
        - code2llm_smell_data_clump
        - code2llm_smell_shotgun_surgery
        - code2llm_smell_feature_envy
        - code2llm_refactor
      name_patterns: ['Address code smell*']
    workflow:
      - id: baseline
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run --skip-gates'
      - id: refactor
        kind: ide_work
        auto: false
        hint: >-
          Remediate the reported code smell by encapsulating data clumps,
          extracting abstractions, or localizing variable mutations; preserve behavior and run local tests.
      - id: verify
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run'

  taskand_operational:
    description: Execute operational and sandboxed process tasks via Taskand or Twinerd.
    match:
      labels_any: [operational, ops, sandbox, taskand, twinerd]
      signals_any:
        - taskand_operational
        - twinerd_sandbox
        - proc_execution
      name_patterns: ['Operational:*', 'Taskand:*', 'Run operational*', 'Sandbox:*']
    workflow:
      - id: baseline
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run --skip-gates'
      - id: execute_taskand
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru --queue --once'
      - id: verify
        kind: shell
        auto: true
        command: sh -c 'cd {repo} && koru ci run'

  idle_scan:
    description: Turn repo signals into planfile tickets when the queue is idle.
    match:
      phase: idle_scan
    workflow:
      - id: scan_dry
        kind: shell
        auto: true
        command: koru scan --project {project}
      - id: scan_apply
        kind: shell
        auto: true
        command: koru scan --apply --semcod-artifacts --project {project}

  whole_project_discovery:
    description: Broad code2llm discovery when no runnable refactor tickets remain.
    match:
      phase: whole_project_discovery
    workflow:
      - id: code2llm
        kind: shell
        auto: true
        command: >-
          code2llm {project} -f all -o {project}/project --no-chunk --exclude '*.md'
          --planfile-apply --planfile-source koru-project-discovery
          --planfile-sprint current --planfile-project {project} --planfile-limit 20

phases:
  planfile_queue:
    description: Execute the highest-priority runnable planfile ticket.
  idle_scan:
    description: Scan for new signals when no refactor tickets are runnable.
  whole_project_discovery:
    description: Run code2llm discovery to regenerate the backlog.
