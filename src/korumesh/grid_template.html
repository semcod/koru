<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Koru mesh grid</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;background:#111;color:#eee}
nav.top{display:flex;gap:12px;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #2a2a2a;flex-wrap:wrap}
nav.top a{color:#9ad;text-decoration:none}
nav.top a:hover{text-decoration:underline}
nav.top .sep{color:#555}
.peer-section{margin-bottom:24px}
.peer-section h2{margin:8px 0 10px;font-size:14px;color:#cde;text-transform:uppercase;letter-spacing:0.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:#1c1c1c;border:1px solid #333;border-radius:8px;padding:8px;display:flex;flex-direction:column}
.tile img{width:100%;height:auto;border-radius:4px;background:#000;image-rendering:auto}
.tile .badge{display:inline-block;background:#243149;color:#9ad;padding:1px 6px;border-radius:99px;font-size:11px;margin-right:4px}
.tile .meta{font-size:12px;color:#aaa;margin-top:6px;line-height:1.4}
.tile .meta strong{color:#cde}
.tile.blocked{border-color:#5c3b2a;background:#241915}
.tile.blocked .placeholder{background:#1a0e0a;color:#e6a675;border:1px dashed #6b4530;border-radius:4px;
  padding:24px 12px;text-align:center;font-size:13px;line-height:1.5;min-height:140px;display:flex;
  align-items:center;justify-content:center}
.empty{color:#888;font-style:italic;padding:24px;text-align:center}
.diag{background:#241915;border:1px solid #5c3b2a;border-radius:8px;padding:12px 14px;margin:0 0 18px;
  font-size:13px;color:#e6a675;line-height:1.5}
.diag strong{color:#ffb37a}
.diag code{background:#1a0e0a;padding:1px 5px;border-radius:3px;color:#ffd1a8;font-size:12px}
</style></head><body>
<nav class="top">
  <a href="/">← Koru dashboard</a>
  <span class="sep">·</span>
  <strong>Observation grid</strong>
  <span class="sep">·</span>
  <a href="/api/mesh/frames">frames JSON</a>
  <span class="sep">·</span>
  <a href="/api/mesh/diagnostics">diagnostics JSON</a>
  <span class="sep">·</span>
  <span id="summary" class="meta"></span>
</nav>
<div id="content"></div>
<script>
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function groupFramesByPeer(frames) {
  const map = new Map();
  for (const frame of frames) {
    if (!map.has(frame.peer_from)) map.set(frame.peer_from, []);
    map.get(frame.peer_from).push(frame);
  }
  for (const list of map.values()) {
    list.sort((a, b) => (a.monitor ?? 0) - (b.monitor ?? 0));
  }
  return map;
}

function renderTile(frame) {
  const monitor = frame.monitor ?? -1;
  const output = frame.output || "";
  const labelParts = [];
  if (monitor >= 0) labelParts.push(`monitor ${monitor}`);
  if (output) labelParts.push(output);
  const label = labelParts.join(" · ") || "screen";
  const nativeRes = (frame.native_width && frame.native_height)
    ? `${frame.native_width}×${frame.native_height}` : "?";
  const thumbRes = (frame.width && frame.height)
    ? `${frame.width}×${frame.height}` : "?";
  const scale = (frame.native_width && frame.width)
    ? Math.round((frame.width / frame.native_width) * 100) : null;
  return `<div class="tile">
    <img alt="${esc(label)}" src="data:${esc(frame.mime)};base64,${frame.image_b64}">
    <div class="meta">
      <span class="badge">${esc(label)}</span>
      <strong>${esc(nativeRes)}</strong> native
      → ${esc(thumbRes)} ${scale != null ? `(${scale}%)` : ""}
      <br>${esc(frame.created_at)}
      <br>${frame.bytes.toLocaleString()} bytes
    </div>
  </div>`;
}

function renderPeer(peer, frames) {
  const tiles = frames.map(renderTile).join("");
  return `<section class="peer-section">
    <h2>${esc(peer)} · ${frames.length} monitor${frames.length === 1 ? "" : "s"}</h2>
    <div class="grid">${tiles}</div>
  </section>`;
}

function renderBlockedTile(monitor) {
  const label = `${monitor.output || "monitor " + monitor.id}`;
  const res = (monitor.width && monitor.height)
    ? `${monitor.width}×${monitor.height}` : "?";
  return `<div class="tile blocked">
    <div class="placeholder">capture<br>blocked</div>
    <div class="meta">
      <span class="badge">${esc(label)}</span>
      <strong>${esc(res)}</strong> native
      <br>no frame published yet
    </div>
  </div>`;
}

function renderDiagnostics(diag) {
  if (!diag || diag.status === "ok") return "";
  if (diag.status === "no-log") {
    return `<div class="diag">No vision agent log yet. Start it with
      <code>koru observe up</code>.</div>`;
  }
  const session = esc(diag.session_type || "unknown");
  const err = esc(diag.last_error || "(no error recorded)");
  const hint = diag.hint ? `<div style="margin-top:8px">${esc(diag.hint)}</div>` : "";
  return `<div class="diag">
    <strong>Capture blocked on ${session}.</strong>
    Last error: <code>${err}</code>${hint}
  </div>`;
}

function renderBlockedGrid(diag) {
  const monitors = (diag && diag.monitors) || [];
  if (!monitors.length) {
    return `<div class="empty">No frames yet. Run <code>koru observe up</code>
      or <code>koru vision agent --publish-mesh</code> on a peer.</div>`;
  }
  const tiles = monitors.map(renderBlockedTile).join("");
  return `<section class="peer-section">
    <h2>local · ${monitors.length} monitor${monitors.length === 1 ? "" : "s"} (no capture)</h2>
    <div class="grid">${tiles}</div>
  </section>`;
}

async function refresh() {
  const [framesRes, diagRes] = await Promise.all([
    fetch("/api/mesh/frames", { cache: "no-store" }),
    fetch("/api/mesh/diagnostics", { cache: "no-store" }).catch(() => null),
  ]);
  const data = await framesRes.json();
  const diag = (diagRes && diagRes.ok) ? await diagRes.json() : null;
  const content = document.getElementById("content");
  const summary = document.getElementById("summary");
  const frames = data.frames || [];
  if (frames.length === 0) {
    content.innerHTML = renderDiagnostics(diag) + renderBlockedGrid(diag);
    const m = (diag && diag.monitors) || [];
    summary.textContent = m.length
      ? `0 frames · ${m.length} monitor${m.length === 1 ? "" : "s"} detected · capture blocked`
      : "no frames";
    return;
  }
  const peers = groupFramesByPeer(frames);
  const html = Array.from(peers.entries())
    .map(([peer, list]) => renderPeer(peer, list)).join("");
  content.innerHTML = renderDiagnostics(diag) + html;
  const totalMonitors = frames.length;
  summary.textContent = `${peers.size} peer${peers.size === 1 ? "" : "s"} · `
    + `${totalMonitors} monitor${totalMonitors === 1 ? "" : "s"} · refresh every 30s`;
}

refresh();
setInterval(refresh, 30000);
</script></body></html>
