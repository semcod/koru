[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coru"
version = "0.1.0"
description = "Thin user-facing client for koruenv + koru automation workflows."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Semcod" }]
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
llm = [
  "nlp2coru>=0.1.0",
  "nlp2coru[llm]",
]

[project.scripts]
coru = "coru.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
