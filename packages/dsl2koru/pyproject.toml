[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl2koru"
version = "0.1.0"
description = "Koru control DSL with JSON Schema validation and CQRS bus"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.0",
    "protobuf>=6.33.5,<7.0",
    "coru>=0.1.0",
    "koruenv>=0.1.0",
    "uri2koru>=0.1.0",
]

[project.optional-dependencies]
codegen = ["pydantic>=2.0", "grpcio-tools>=1.60"]
dev = ["pytest>=8.0", "pydantic>=2.0"]

[project.scripts]
dsl2koru = "dsl2koru.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dsl2koru" = ["schema/commands/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
