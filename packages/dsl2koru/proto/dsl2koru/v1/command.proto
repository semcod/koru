syntax = "proto3";
package dsl2koru.v1;

message QueryRepairHistoryQuery {
  string project = 1;
  int32 limit = 2;
  string code = 3;
}

message QueryLaneStatusQuery {
  string ide = 1;
  string instance = 2;
}

message ValidateLaneQuery {
  string ide = 1;
  string instance = 2;
}

message ResolveQuery {
  string prompt = 1;
  string project = 2;
}

message RepairRunCommand {
  string ide = 1;
  string instance = 2;
  string project = 3;
  string trigger = 4;
  bool fix = 5;
}

message StatusQuery {
  bool probe = 1;
}

message RepairHistoryQuery {}

message EnvQuery {
  string file = 1;
}

message CoruQuery {
  string target = 1;
}

message AutoCommand {
  string shell = 1;
  repeated string auto_args = 2;
  string target = 3;
}

message LaneCommand {
  string ide = 1;
  string instance = 2;
  string file = 3;
  bool lane_status = 4;
}

message EnsureCommand {
  bool install = 1;
}

message DoctorCommand {
  bool fix = 1;
  bool probe = 2;
  string probe_prompt = 3;
}

message CalibrationCommand {
  bool skip_fix = 1;
  bool skip_desktop = 2;
  bool skip_bridge = 3;
  string probe_prompt = 4;
}

message ChatCommand {
  bool llm = 1;
  string shell = 2;
  bool single_action = 3;
}

message TextCommand {
  string target = 1;
  bool llm = 2;
  string shell = 3;
  bool single_action = 4;
}

message SyncCommand {
  bool all_ides = 1;
}

message DslEnvelope {
  string verb = 1;
  oneof body {
    QueryRepairHistoryQuery query_repair_history = 10;
    QueryLaneStatusQuery query_lane_status = 11;
    ValidateLaneQuery validate_lane = 12;
    ResolveQuery resolve = 13;
    RepairRunCommand repair_run = 14;
    StatusQuery status = 30;
    RepairHistoryQuery repair_history = 31;
    EnvQuery env = 32;
    CoruQuery query = 33;
    AutoCommand auto = 34;
    LaneCommand lane = 35;
    EnsureCommand ensure = 36;
    DoctorCommand doctor = 37;
    CalibrationCommand calibration = 38;
    ChatCommand chat = 39;
    TextCommand text = 40;
    SyncCommand sync = 41;
  }
  string default_project = 20;
  string correlation_id = 21;
  string default_file = 50;
}
