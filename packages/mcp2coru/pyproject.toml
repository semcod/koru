[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp2coru"
version = "0.1.0"
description = "MCP server exposing dsl2coru control tools"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "mcp2koru>=0.1.0",
    "dsl2coru>=0.1.0",
    "nlp2coru>=0.1.0",
    "mcp>=1.0",
]

[project.scripts]
mcp2coru = "mcp2coru.cli:main"
mcp2coru-mcp = "mcp2coru.server:run_server"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
