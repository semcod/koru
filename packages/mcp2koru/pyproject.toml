[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp2koru"
version = "0.1.0"
description = "MCP server exposing dsl2koru control tools"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "dsl2koru>=0.1.0",
    "nlp2koru>=0.1.0",
    "mcp>=1.0",
]

[project.scripts]
mcp2koru = "mcp2koru.cli:main"
mcp2koru-mcp = "mcp2koru.server:run_server"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
