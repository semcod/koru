[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp2coru"
version = "0.1.0"
description = "NLP -> CORU command DSL adapter"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "dsl2coru>=0.1.0",
    "dsl2koru>=0.1.0",
    "uri2coru>=0.1.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.51,<2.0"]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
nlp2coru = "nlp2coru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
