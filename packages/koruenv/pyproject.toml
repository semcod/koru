[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koruenv"
version = "0.1.0"
description = "Environment and lane orchestration helpers for Koru."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Semcod" }]
license = "Apache-2.0"
dependencies = []

[project.scripts]
koruenv = "koruenv.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
