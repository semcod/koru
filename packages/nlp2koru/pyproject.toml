[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp2koru"
version = "0.1.0"
description = "Natural language → dsl2koru command lines"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "dsl2koru>=0.1.0",
    "uri2koru>=0.1.0",
    "nlpshim>=0.1.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.51,<2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
nlp2koru = "nlp2koru.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
