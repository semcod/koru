[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlpshim"
version = "0.1.0"
description = "Shared NLP to DSL fallback bridge for semcod projects"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
nlp2dsl = ["nlp2dsl>=0.0.7"]
intent = ["nlp2cmd-intent>=0.1.0"]
full = ["nlp2dsl>=0.0.7", "nlp2cmd-intent>=0.1.0", "httpx>=0.27"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
