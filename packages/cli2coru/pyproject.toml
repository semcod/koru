[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli2coru"
version = "0.1.0"
description = "Interactive shell for dsl2coru"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["dsl2coru>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cli2coru = "cli2coru.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
