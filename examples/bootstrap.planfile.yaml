schema: "1.1"
project: koru-bootstrap-example
version: "0.1.0"
generated: "2026-05-10"
generator: "koru pipeline template"
description: |
  Bootstrap pipeline for integrating koru with a new project.

  Schema follows docs/planfile-execution-gateway.md:
  each task declares top-level `executor` (kind/mode/handler),
  `execution` (state tracking), `inputs`, `outputs`, and uses
  `blocked_by`/`blocks` (planfile native) for dependencies.

  Import into planfile.yaml of your new project, then run:

      koru queue        # inspect queue
      koru run          # run next runnable task
      koru watch        # live view

  Demonstrates all five executor kinds: shell, human, tool, llm, api.

tasks:
  # ─────────────────────────────────────────────────────────────────
  # Phase 1: Preconditions (shell, automatic)
  # ─────────────────────────────────────────────────────────────────

  - id: KORU-B-001
    name: "Verify we're in a git repository"
    status: open
    priority: high
    blocked_by: []
    blocks: [KORU-B-010]
    labels: [koru-bootstrap, phase:precheck]
    executor:
      kind: shell
      mode: automatic
      handler: "git rev-parse --git-dir"
    execution:
      queue: default
      state: pending
      assigned_to: null
      started_at: null
      finished_at: null
      attempt: 0
      max_attempts: 1
      last_error: null
    inputs:
      script: null
      prompt: null
      env_keys: []
      error_hint: "Not a git repository. Run 'git init' first."
    outputs:
      artifacts: []
      notes: []
      result: null

  - id: KORU-B-002
    name: "Verify Python >= 3.10"
    status: open
    priority: high
    blocked_by: []
    blocks: [KORU-B-010]
    labels: [koru-bootstrap, phase:precheck]
    executor:
      kind: shell
      mode: automatic
      handler: "python3 -c 'import sys; sys.exit(0 if sys.version_info>=(3,10) else 1)'"
    execution:
      queue: default
      state: pending
      attempt: 0
      max_attempts: 1
    inputs: {}
    outputs:
      artifacts: []
      notes: []
      result: null

  # ─────────────────────────────────────────────────────────────────
  # Phase 2: Install (shell, automatic)
  # ─────────────────────────────────────────────────────────────────

  - id: KORU-B-010
    name: "Install koru package"
    status: open
    priority: high
    blocked_by: [KORU-B-001, KORU-B-002]
    blocks: [KORU-B-011]
    labels: [koru-bootstrap, phase:install]
    executor:
      kind: shell
      mode: automatic
      handler: "pip install koru"
    execution:
      queue: default
      state: pending
      attempt: 0
      max_attempts: 2
      timeout_sec: 120
    inputs: {}
    outputs:
      artifacts: ["~/.local/bin/koru"]
      notes: []
      result: null

  - id: KORU-B-011
    name: "Install core LLM-free tools (planfile, regix, redup)"
    status: open
    priority: high
    blocked_by: [KORU-B-010]
    blocks: [KORU-B-020]
    labels: [koru-bootstrap, phase:install]
    executor:
      kind: shell
      mode: automatic
      handler: "pip install planfile regix redup"
    execution:
      queue: default
      state: pending
      timeout_sec: 180
    inputs: {}
    outputs:
      artifacts: []
      notes: []
      result: null

  # ─────────────────────────────────────────────────────────────────
  # Phase 3: Human decisions (human, interactive)
  # ─────────────────────────────────────────────────────────────────

  - id: KORU-B-020
    name: "Decide: enable OpenRouter automation lane?"
    status: open
    priority: high
    blocked_by: [KORU-B-011]
    blocks: [KORU-B-021, KORU-B-022]
    labels: [koru-bootstrap, phase:config]
    executor:
      kind: human
      mode: interactive
      handler: confirm
    execution:
      queue: default
      state: pending
    inputs:
      prompt: |
        Koru supports two modes:

          1. Default (IDE-native LLM, no cloud API) — $0, recommended daily.
          2. Opt-in (OpenRouter automation lane) — metered, needed for
             `redsl improve`, `vallm validate --semantic`, headless auto-fix.

        Enable the OpenRouter automation lane?
      default: false
    outputs:
      artifacts: []
      notes: []
      result: null

  - id: KORU-B-021
    name: "Get OPENROUTER_API_KEY from user"
    status: open
    priority: high
    blocked_by: [KORU-B-020]
    blocks: [KORU-B-030]
    labels: [koru-bootstrap, phase:config]
    executor:
      kind: human
      mode: interactive
      handler: password
    execution:
      queue: default
      state: pending
      skip_if: "task(KORU-B-020).outputs.result == false"
    inputs:
      prompt: "Paste your OPENROUTER_API_KEY (starts with sk-or-v1-)"
      env_keys: [OPENROUTER_API_KEY]
    outputs:
      artifacts: []
      notes: []
      result: null

  - id: KORU-B-022
    name: "Choose config templates to install"
    status: open
    priority: normal
    blocked_by: [KORU-B-020]
    blocks: [KORU-B-031]
    labels: [koru-bootstrap, phase:config]
    executor:
      kind: human
      mode: interactive
      handler: multi_choice
    execution:
      queue: default
      state: pending
    inputs:
      prompt: "Which config templates do you want to install?"
      choices:
        - pyqual.yaml
        - redup.toml
        - regix.yaml
        - redsl.yaml
        - llx.yaml
      default: [pyqual.yaml, redup.toml, regix.yaml]
    outputs:
      artifacts: []
      notes: []
      result: null

  # ─────────────────────────────────────────────────────────────────
  # Phase 4: Write configs (shell/tool, automatic)
  # ─────────────────────────────────────────────────────────────────

  - id: KORU-B-030
    name: "Write .env file with OPENROUTER_API_KEY"
    status: open
    priority: high
    blocked_by: [KORU-B-021]
    blocks: [KORU-B-040]
    labels: [koru-bootstrap, phase:config]
    executor:
      kind: shell
      mode: automatic
      handler: "scripts/write-env.sh"
    execution:
      queue: default
      state: pending
      skip_if: "task(KORU-B-020).outputs.result == false"
    inputs:
      env_keys_from: [KORU-B-021]
      script: "scripts/write-env.sh"
    outputs:
      artifacts: [".env", ".gitignore"]
      notes: []
      result: null

  - id: KORU-B-031
    name: "Copy selected templates to project root"
    status: open
    priority: high
    blocked_by: [KORU-B-022]
    blocks: [KORU-B-040, KORU-B-041]
    labels: [koru-bootstrap, phase:config]
    executor:
      kind: shell
      mode: automatic
      handler: "koru template install"
    execution:
      queue: default
      state: pending
    inputs:
      templates_from: [KORU-B-022]
    outputs:
      artifacts: []
      notes: []
      result: null

  # ─────────────────────────────────────────────────────────────────
  # Phase 5: Baseline (tool, automatic)
  # ─────────────────────────────────────────────────────────────────

  - id: KORU-B-040
    name: "Run first regix gate (establish baseline)"
    status: open
    priority: normal
    blocked_by: [KORU-B-031]
    blocks: [KORU-B-050]
    labels: [koru-bootstrap, phase:baseline]
    executor:
      kind: shell
      mode: automatic
      handler: "regix gate --format json --output .regix/baseline.json"
    execution:
      queue: default
      state: pending
      timeout_sec: 60
      on_failure: continue
    inputs: {}
    outputs:
      artifacts: [".regix/baseline.json"]
      notes: []
      result: null

  - id: KORU-B-041
    name: "Run first redup check (baseline duplicates)"
    status: open
    priority: normal
    blocked_by: [KORU-B-031]
    blocks: []
    labels: [koru-bootstrap, phase:baseline]
    executor:
      kind: shell
      mode: automatic
      handler: "redup scan . --min-lines 10 --format json --output .redup/baseline.json"
    execution:
      queue: default
      state: pending
      timeout_sec: 120
      on_failure: continue
    inputs: {}
    outputs:
      artifacts: [".redup/baseline.json"]
      notes: []
      result: null

  # ─────────────────────────────────────────────────────────────────
  # Phase 6: LLM-assisted tuning (llm, only if OpenRouter opted-in)
  # ─────────────────────────────────────────────────────────────────

  - id: KORU-B-050
    name: "LLM: suggest project-specific regix thresholds"
    status: open
    priority: low
    blocked_by: [KORU-B-040]
    blocks: [KORU-B-051]
    labels: [koru-bootstrap, phase:tuning, opt-in]
    executor:
      kind: llm
      mode: automatic
      handler: "openrouter"
    execution:
      queue: default
      state: pending
      skip_if: "task(KORU-B-020).outputs.result == false"
    inputs:
      llm_model: "anthropic/claude-3.5-sonnet"
      max_tokens: 1500
      env_keys: [OPENROUTER_API_KEY]
      prompt_template: |
        Tune regix.yaml gate thresholds for a new Python project.

        Baseline report: ${baseline_json}

        Output ONLY valid YAML for the `gate` section, values ~20% above
        current metrics. No markdown fences, no prose.
      baseline_from: KORU-B-040
    outputs:
      artifacts: []
      notes: []
      result: null   # LLM response stored here

  - id: KORU-B-051
    name: "Human: review LLM suggestion and apply"
    status: open
    priority: low
    blocked_by: [KORU-B-050]
    blocks: [KORU-B-090]
    labels: [koru-bootstrap, phase:tuning]
    executor:
      kind: human
      mode: interactive
      handler: confirm_with_diff
    execution:
      queue: default
      state: pending
      skip_if: "task(KORU-B-020).outputs.result == false"
    inputs:
      prompt: "Apply LLM-suggested regix thresholds?"
      diff_source: KORU-B-050
      target_file: regix.yaml
    outputs:
      artifacts: [regix.yaml]
      notes: []
      result: null

  # ─────────────────────────────────────────────────────────────────
  # Phase 7: Wrap-up (shell + human)
  # ─────────────────────────────────────────────────────────────────

  - id: KORU-B-090
    name: "Commit initial koru config"
    status: open
    priority: normal
    blocked_by: [KORU-B-051]
    blocks: [KORU-B-091]
    labels: [koru-bootstrap, phase:wrap]
    executor:
      kind: shell
      mode: interactive   # never auto-commit — human confirms message
      handler: "git add -A && git commit"
    execution:
      queue: default
      state: pending
    inputs:
      commit_message_template: |
        chore(koru): bootstrap refactor automation config

        - Templates from KORU-B-022
        - OpenRouter lane: from KORU-B-020
        - Baseline in .regix/baseline.json, .redup/baseline.json
    outputs:
      artifacts: []
      notes: []
      result: null

  - id: KORU-B-091
    name: "Show summary and next steps"
    status: open
    priority: normal
    blocked_by: [KORU-B-090]
    blocks: []
    labels: [koru-bootstrap, phase:wrap]
    executor:
      kind: human
      mode: interactive
      handler: info
    execution:
      queue: default
      state: pending
    inputs:
      message: |
        ✓ Koru bootstrap complete.

        Next steps:
          1. Review generated configs: ls *.yaml *.toml
          2. task quality:regix              # verify gate
          3. task tickets:next               # start ticket-driven work
          4. Read docs/agent-guide.md

        Press Enter to finish.
    outputs:
      artifacts: []
      notes: []
      result: null
