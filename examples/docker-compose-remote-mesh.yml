services:
  # Node 1: Symulacja środowiska developerskiego frontend
  node-frontend:
    build:
      context: ..
      dockerfile: examples/Dockerfile.remote-mesh
    container_name: koru-node-frontend
    volumes:
      - ..:/app
    working_dir: /app
    ports:
      - "8765:8765"
    environment:
      - PYTHONPATH=/app/src:/app/packages/coru/src:/app/packages/koruide/src
      - KORU_AUTOPILOT_VERBOSE=1
    command: ["python", "-m", "koru", "serve", "--host", "0.0.0.0", "--port", "8765", "--no-open"]

  # Node 2: Symulacja środowiska developerskiego backend
  node-backend:
    build:
      context: ..
      dockerfile: examples/Dockerfile.remote-mesh
    container_name: koru-node-backend
    volumes:
      - ..:/app
    working_dir: /app
    ports:
      - "8766:8766"
    environment:
      - PYTHONPATH=/app/src:/app/packages/coru/src:/app/packages/koruide/src
      - KORU_AUTOPILOT_VERBOSE=1
    command: ["python", "-m", "koru", "serve", "--host", "0.0.0.0", "--port", "8766", "--no-open"]

networks:
  default:
    name: koru-mesh-network
