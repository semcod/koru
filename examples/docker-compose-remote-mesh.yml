version: '3.8'

services:
  # Node 1: Symulacja środowiska developerskiego frontend
  node-frontend:
    image: python:3.12-slim
    container_name: koru-node-frontend
    volumes:
      - ..:/app
    working_dir: /app
    ports:
      - "8765:8765"
    environment:
      - PYTHONPATH=/app/src
      - KORU_AUTOPILOT_VERBOSE=1
    command: >
      sh -c "pip install pyyaml &&
             python -m koru serve --host 0.0.0.0 --port 8765 --no-open"

  # Node 2: Symulacja środowiska developerskiego backend
  node-backend:
    image: python:3.12-slim
    container_name: koru-node-backend
    volumes:
      - ..:/app
    working_dir: /app
    ports:
      - "8766:8766"
    environment:
      - PYTHONPATH=/app/src
      - KORU_AUTOPILOT_VERBOSE=1
    command: >
      sh -c "pip install pyyaml &&
             python -m koru serve --host 0.0.0.0 --port 8766 --no-open"

networks:
  default:
    name: koru-mesh-network
